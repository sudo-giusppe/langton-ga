name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test (release)
        run: cargo test --release --locked

      - name: Smoke test the classic highway detector
        run: |
          ./target/release/langton-ga analyze \
            --rule classic --steps 120000 --out /tmp/classic_metrics.csv
          grep -q ',104,-2,2,' /tmp/classic_metrics.csv
